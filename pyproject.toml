[project]
name = "health-tender-workbench"
version = "0.1.0"
description = "Local source-cited health commodity tender review"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "mcp>=1.12,<2", "langgraph>=1,<2", "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1", "pypdf>=5,<7", "python-multipart>=0.0.18,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
